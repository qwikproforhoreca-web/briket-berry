server {
    listen 80;
    server_name briket-berry.ru www.briket-berry.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name briket-berry.ru www.briket-berry.ru;

    ssl_certificate /etc/letsencrypt/live/briket-berry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/briket-berry.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Upload limit (for video uploads)
    client_max_body_size 110M;

    # Static frontend (React SPA)
    root /var/www/briket-berry/frontend/dist;
    index index.html;

    # SPA routing — all paths served from index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content hashes)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static uploaded files (videos, images, reviews)
    location /uploads/ {
        alias /var/www/briket-berry/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block access to sensitive files
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(env|json|log|sh|sql)$ { deny all; }
    location ~* /admin\.php { deny all; }
    location ~* \.(git|svn) { deny all; }

    # Favicon & robots (don't log 404s)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/briket-berry.access.log;
    error_log  /var/log/nginx/briket-berry.error.log warn;
}
